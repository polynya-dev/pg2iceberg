name: Docker

# pg2iceberg's image on Docker Hub, docker.io/polynyadev/pg2iceberg, for
# linux/amd64 and linux/arm64: `latest` and `sha-<short>` from main,
# `X.Y.Z` and `X.Y` from a `vX.Y.Z` tag. (Cloudflare Containers refuse
# `latest`: example/cloudflare pins one of the others.)
#
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a
# Docker Hub access token that can push to polynyadev/pg2iceberg).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile cross-compiles for the target platform on the
      # build's own, so both platforms build without emulation.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/polynyadev/pg2iceberg
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
