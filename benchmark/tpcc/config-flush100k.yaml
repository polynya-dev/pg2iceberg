# No `tables`: every TPROC-C table with a primary key (all but `history`,
# unless run.sh gave it one). Defaults, but 10x larger flushes.
source:
  postgres:
    host: postgres
    port: 5432
    database: tpcc
    user: postgres
    password: postgres
  logical:
    publication_name: pg2iceberg_pub
    slot_name: pg2iceberg_slot

sink:
  catalog_uri: http://iceberg-rest:8181
  warehouse: s3://warehouse/
  namespace: tpcc
  s3_endpoint: http://minio:9000
  s3_access_key: admin
  s3_secret_key: password
  s3_region: us-east-1
  flush_rows: 100000
