# Postgres -> pg2iceberg -> Iceberg REST catalog + MinIO, with ClickHouse to
# query the tables and a mixed workload to drive Postgres. See README.md.
name: pg2iceberg-single
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rideshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5502:5432"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./setup.sql:/docker-entrypoint-initdb.d/03-setup.sql
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rideshare"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15

  create-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set m http://minio:9000 admin password && mc mb --ignore-existing m/warehouse"

  iceberg-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg"]
      interval: 2s
      timeout: 5s
      retries: 15

  iceberg-rest:
    build: ./iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://iceberg-postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8181:8181"]
    depends_on:
      iceberg-postgres: {condition: service_healthy}
      create-bucket: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  pg2iceberg:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["run", "--config", "/etc/pg2iceberg/config.yaml"]
    environment:
      RUST_LOG: info
    volumes:
      - ./config.yaml:/etc/pg2iceberg/config.yaml:ro
    depends_on:
      postgres: {condition: service_healthy}
      iceberg-rest: {condition: service_healthy}

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    ports: ["8123:8123"]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
    volumes:
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/s3.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/iceberg.xml
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    depends_on:
      iceberg-rest: {condition: service_healthy}

  workload:
    image: python:3.12-slim
    profiles: ["workload"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rideshare
      DURATION: ${DURATION:-300}
    volumes:
      - ./simulate.py:/app/simulate.py
      - ./workload.py:/app/workload.py
    working_dir: /app
    command: sh -c "pip install -q psycopg2-binary && python -u workload.py"
